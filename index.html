<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometric Pattern Generator</title>
  <meta name="description" content="Generate seeded geometric line-texture patterns. Share them by link, export PNG or SVG at any size.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Geometric Pattern Generator">
  <meta property="og:description" content="Seeded geometric line-texture patterns. Share by link, export PNG or SVG.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pxl-pshr.github.io/geometric-pattern-generator/">
  <meta property="og:image" content="https://i.postimg.cc/m22DyR4q/download-7.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141414'/%3E%3Cg stroke-width='3' stroke-opacity='.8'%3E%3Cpath d='M-2 14 14-2M-2 22 22-2' stroke='%23FF6B6B'/%3E%3Cpath d='M10 34 34 10M18 34 34 18' stroke='%233A86FF'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="tb-group tb-main">
      <button type="button" id="prev-btn" class="icon-btn" aria-label="Previous pattern" title="Previous pattern (←)" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
      </button>
      <button type="button" id="next-btn" class="icon-btn" aria-label="Next pattern" title="Next pattern (→)" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>
      </button>
      <button type="button" id="generate-btn" class="generate-btn" title="New pattern (Space)">Generate</button>
    </div>

    <form class="tb-group tb-seed" id="seed-form" autocomplete="off">
      <label for="seed-input" class="visually-hidden">Seed</label>
      <input type="text" id="seed-input" class="seed-input" placeholder="Enter seed" maxlength="64" spellcheck="false" autocapitalize="off" enterkeyhint="go">
      <button type="submit" class="seed-btn">Apply</button>
      <button type="button" id="copy-link-btn" class="seed-btn" title="Copy a link to this exact pattern (C)">Copy link</button>
    </form>

    <div class="tb-group tb-actions">
      <button type="button" id="options-btn" aria-expanded="false" aria-controls="options-panel" title="Options (O)">Options</button>
      <button type="button" id="save-png-btn" title="Save PNG (S)"><span class="wide-only">Save&nbsp;</span>PNG</button>
      <button type="button" id="save-svg-btn" title="Save SVG (V)"><span class="wide-only">Save&nbsp;</span>SVG</button>
      <a href="https://github.com/pxl-pshr/geometric-pattern-generator" target="_blank" rel="noopener" class="github-link wide-only">GitHub</a>
    </div>
  </header>

  <div class="workspace">
    <main class="stage" id="stage">
      <canvas id="canvas" role="img" aria-label="Generated geometric pattern"></canvas>
    </main>

    <aside class="panel" id="options-panel" aria-label="Options" hidden>
      <div class="panel-head">
        <p class="panel-summary" id="summary"></p>
        <button type="button" class="close-btn" id="close-options-btn" aria-label="Close options">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>

      <section>
        <h2>Format</h2>
        <div class="chips" id="format-chips"></div>
        <div class="custom-size" id="custom-size" hidden>
          <label>W <input type="number" id="custom-width" min="64" max="8192" step="1" inputmode="numeric"></label>
          <span aria-hidden="true">×</span>
          <label>H <input type="number" id="custom-height" min="64" max="8192" step="1" inputmode="numeric"></label>
        </div>
      </section>

      <section>
        <h2>Palette</h2>
        <div class="palettes" id="palette-list"></div>
      </section>

      <section>
        <h2>Styles</h2>
        <div class="chips" id="style-chips"></div>
      </section>

      <section>
        <h2>Background</h2>
        <div class="chips" id="background-chips">
          <button type="button" class="chip" data-bg="dark">Dark</button>
          <button type="button" class="chip" data-bg="light">Light</button>
          <button type="button" class="chip" data-bg="transparent">Transparent</button>
          <label class="chip color-chip" id="custom-bg-chip">
            <input type="color" id="custom-bg" value="#1b1f3b" aria-label="Custom background colour">
            Custom
          </label>
        </div>
      </section>

      <section>
        <h2><label for="texture-range">Texture scale</label> <output id="texture-value" for="texture-range">1×</output></h2>
        <input type="range" id="texture-range" min="0.5" max="3" step="0.25" value="1">
      </section>

      <section>
        <h2>Export resolution</h2>
        <div class="chips" id="export-chips"></div>
        <p class="hint" id="export-hint"></p>
      </section>

      <section>
        <h2>Shortcuts</h2>
        <dl class="shortcuts">
          <dt><kbd>Space</kbd></dt><dd>New pattern</dd>
          <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>Previous / next</dd>
          <dt><kbd>S</kbd> <kbd>V</kbd></dt><dd>Save PNG / SVG</dd>
          <dt><kbd>C</kbd></dt><dd>Copy link</dd>
          <dt><kbd>T</kbd></dt><dd>Toggle transparent</dd>
          <dt><kbd>O</kbd></dt><dd>Options</dd>
        </dl>
      </section>

      <div class="panel-foot">
        <button type="button" class="text-btn" id="reset-btn">Reset options</button>
        <a href="https://github.com/pxl-pshr/geometric-pattern-generator" target="_blank" rel="noopener" class="text-btn">GitHub</a>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="src/generator.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
